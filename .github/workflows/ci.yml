name: CI

# Every other test finding in the register is unenforced without this: nothing
# stopped a PR that deleted assertions, skipped a suite, or broke the auth
# enforcement tests (archived-79). The suites already existed and were green — they
# just only ever ran on one machine.
#
# Three jobs rather than one, so a red build says *what* broke without reading
# a log: the SPA gates are seconds, the backend suite is minutes, and E2E needs
# a browser download. They run in parallel; e2e depends on spa only because it
# needs the built assets.

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

# A second push to the same PR cancels the first. These suites take ~15
# minutes; without this a busy branch queues runs it no longer cares about.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # The fixtures default to these and read the env var so a rotated local
  # secret does not require editing the test project. Kept explicit here so
  # the workflow does not silently depend on a default.
  AUTONATE_POSTGRES_PASSWORD: Your_password123!

jobs:
  spa:
    name: SPA (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/AutoNate.Spa/package-lock.json

      - name: Install
        working-directory: src/AutoNate.Spa
        run: npm ci

      # `npm run lint` carries the warning ratchet (--max-warnings) and the
      # jsx-a11y error gate, so a new accessibility regression fails here.
      - name: Lint
        working-directory: src/AutoNate.Spa
        run: npm run lint

      - name: Typecheck
        working-directory: src/AutoNate.Spa
        run: npx tsc -b

      - name: Build
        working-directory: src/AutoNate.Spa
        run: npm run build

      # Vite writes to src/AutoNate.Spa/dist; the MSBuild BuildSpa target is
      # what normally mirrors it into AutoNate.Web/wwwroot. The backend job
      # needs those assets (see its download step) and there is no reason to
      # build the same bundle twice.
      - uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: src/AutoNate.Spa/dist
          retention-days: 1

  # ── Backend suite, sharded ────────────────────────────────────────────────
  #
  # One job became three: discover -> shard matrix -> reconcile. The suite is
  # ~1,760 integration tests that each create and drop real databases, so there
  # is no fast unit subset to carve out; the only lever on wall clock is
  # parallelism across runners. Runner minutes are free on a public repository,
  # which is what makes this a cheap trade rather than an expensive one.
  #
  # Understand this before editing any of it: the dangerous failure here is not
  # a red build, it is a *faster, greener* one. A filter that matches nothing
  # runs no tests and reports success. backend-reconcile exists to catch that,
  # which is why it runs even when shards fail.
  #
  # The parsing and markdown live in .github/scripts/*.py rather than inline.
  # Inline Python must stay indented under a `run: |` block or it silently ends
  # it, and building markdown in shell puts backticks inside double quotes
  # where the shell substitutes them. Both are tested (TestPartitionScriptTests,
  # ShardReportScriptTests).
  backend-discover:
    name: Backend discovery
    runs-on: ubuntu-latest
    # For the SPA bundle only - see the download step below.
    needs: spa
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}
      total: ${{ steps.partition.outputs.total }}
    env:
      # The one place the shard count lives. Chosen by simulating the real hash
      # partition against per-class timings from a local run: 8 shards puts the
      # slowest at ~7 minutes against the 10-minute target, with headroom for
      # the suite to grow. The hash is lumpy - a 21-45 class-minute spread
      # against a 31-minute ideal, because one class alone is 12 - so retune
      # from the step summary rather than from arithmetic.
      BACKEND_SHARDS: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Several backend tests need the SPA bundle in wwwroot/, for two
      # different reasons:
      #
      #   * Program.cs wires the static-file pipeline, the SPA fallback and
      #     the /api 404 guard inside `if (Directory.Exists(WebRootPath))`,
      #     because in Debug the SPA is served by Vite and the directory is
      #     normally absent. Without it `Unknown_api_path_returns_404_not_spa_index`
      #     sees no `no-store` header.
      #   * Tests that sign in follow the post-login redirect to "/", which is
      #     served by MapFallbackToFile("index.html"). An empty directory is
      #     not enough - the redirect lands on a 404 and the login assertion
      #     fails (DataStoreListFilteringTests).
      #
      # Both reproduced locally, first with the directory moved aside and then
      # with it emptied, which is what separated the two causes.
      #
      # Downloaded here, before the build, so the bundle is inside the build
      # output the shards receive. Otherwise every shard needs its own copy and
      # the copies can drift.
      - uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: src/AutoNate.Web/wwwroot

      # Locked mode: the committed packages.lock.json files are the contract.
      # A PackageReference changed without regenerating them fails here rather
      # than resolving a different transitive graph than the one that was
      # reviewed. Regenerate with `make lockfiles`.
      - name: Restore
        run: dotnet restore --locked-mode

      # Deliberately not `-warnaserror`: the tree currently carries a handful
      # of analyzer warnings (CA1512, S6667) in code this workflow does not
      # own. Turning them fatal here would make CI red on arrival, which is
      # how a gate gets disabled. Clearing them is its own task; this job
      # enforces the tests.
      #
      # This is the only place the compiler runs for the backend - the shards
      # receive the output.
      - name: Build
        run: dotnet build --no-restore

      - name: Discover tests and compute the partition
        id: partition
        # Discovery happens exactly once. Re-discovering per shard would be
        # both wasteful and a second place for the partitions to disagree.
        #
        # partition_tests.py refuses to emit an empty partition or an empty
        # shard, and hard-fails on a class-name prefix collision, which a
        # substring filter cannot separate. It also strips theory arguments
        # before taking the class name: `--list-tests` prints those inline, and
        # a parse expecting Namespace.Class.Method drops every theory row. That
        # silently lost all 24 tests of KindGateEnforcementTests during
        # development, and left a partition that looked perfectly healthy.
        run: |
          dotnet test tests/AutoNate.Web.Tests --no-build --list-tests > listing.txt
          script=.github/scripts/partition_tests.py

          {
            echo "matrix=$(python3 $script --shards "$BACKEND_SHARDS" --list-tests listing.txt --emit matrix)"
            echo "total=$(python3 $script --shards "$BACKEND_SHARDS" --list-tests listing.txt --emit total)"
          } >> "$GITHUB_OUTPUT"

          python3 $script --shards "$BACKEND_SHARDS" --list-tests listing.txt \
            --emit summary >> "$GITHUB_STEP_SUMMARY"

      # Tarred by hand rather than handed to upload-artifact directly: the
      # build output is ~480 MB across tens of thousands of small files, and
      # the action's own zipping of that many entries is far slower than one
      # already-compressed blob.
      #
      # This is a handoff, not a cache. It is built fresh in this run from this
      # commit, exactly like the spa-dist artifact above, so the usual
      # stale-cache failure mode cannot arise.
      - name: Pack the build for the shards
        run: |
          tar -czf backend-build.tgz \
            tests/AutoNate.Web.Tests/bin \
            $(find . -maxdepth 3 -type d -name obj -not -path "./src/AutoNate.Spa/*")
          ls -lh backend-build.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend-build.tgz
          retention-days: 1
          # Already gzipped; compressing it again buys nothing and costs time.
          compression-level: 0

  backend:
    name: Backend tests (shard ${{ matrix.shard.index }})
    runs-on: ubuntu-latest
    needs: backend-discover
    # Each shard is a fraction of a suite that takes ~40 minutes whole. The
    # ceiling catches a hung fixture, not a slow runner, so it keeps headroom
    # well above the real duration rather than sitting where the suite can
    # drift into it.
    timeout-minutes: 30

    strategy:
      # Never cancel siblings. Cancelling on the first failure hides whether
      # other shards also failed, turning one red test into a re-run to find
      # out - and it would starve backend-reconcile of the counts it needs to
      # tell a lost test from a failing one.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.backend-discover.outputs.matrix) }}

    services:
      # Matches infra/docker-compose.yml. The tests create and drop their own
      # databases against this instance, so no init scripts are needed - the
      # E2E fixture replays infra/postgres/init/02-*.sql itself.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Start PostgreSQL
        # Not a service container, for the same reason NATS is not one below:
        # `options:` is passed straight to `docker create`, which has no way to
        # supply a command. `--cmd` is not a docker flag and fails the job with
        # `unknown flag: --cmd` before anything runs.
        #
        # The command matters. The suite builds a database per test class and
        # runs those classes in parallel, so many initialisations can be in
        # flight at once. At PostgreSQL's default max_connections of 100 the run
        # fails en masse with "53300: sorry, too many clients already", and the
        # failures look like anything but a connection ceiling. Matches
        # infra/docker-compose.yml.
        #
        # One per shard, and that is the entire isolation story: each matrix leg
        # is its own runner VM, so there is no shared server for shards to
        # contend on. That matters specifically because the suite touches
        # cluster-wide objects - `plg_readers` is created by
        # PluginDataIsolationSql behind an `EXCEPTION WHEN duplicate_object`
        # guard precisely because concurrent creation races, and
        # RoleCreationRaceTests pins that behaviour. Those races stay *within* a
        # shard, where the suite's existing intra-class parallelism already
        # exercises them.
        run: |
          docker run -d --name autonate-ci-postgres \
            -e POSTGRES_USER=autonate \
            -e POSTGRES_PASSWORD='Your_password123!' \
            -e POSTGRES_DB=flowable \
            -p 5432:5432 \
            postgres:16-alpine -c max_connections=300
          for i in $(seq 1 30); do
            if docker exec autonate-ci-postgres pg_isready -U autonate -d flowable >/dev/null 2>&1; then
              echo "PostgreSQL ready"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"; docker logs autonate-ci-postgres; exit 1

      - name: Start NATS with JetStream
        # Not a service container: those cannot pass a `command`, and NATS only
        # enables JetStream when started with --jetstream. The app's
        # NatsStreamProvisioner asserts the streams it needs on boot, so the
        # bootstrap script the compose stack runs is not needed here.
        run: |
          docker run -d --name autonate-ci-nats \
            -p 4222:4222 -p 8222:8222 \
            nats:2.12-alpine --jetstream --http_port 8222
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "NATS ready"; exit 0
            fi
            sleep 2
          done
          echo "NATS did not become healthy"; docker logs autonate-ci-nats; exit 1

      - uses: actions/download-artifact@v4
        with:
          name: backend-build

      - name: Unpack the build
        # No restore and no build in this job: backend-discover did both, and
        # the SPA bundle is inside this tarball.
        run: |
          tar -xzf backend-build.tgz
          rm -f backend-build.tgz

      - name: Test
        id: test
        # `trx` rather than `console;verbosity=minimal`. The console logger
        # prints failure names without their assertion messages, which cost a
        # whole diagnosis cycle on this suite once already; the trx carries the
        # message, and the next step reads the executed count out of it.
        #
        # The exit code is captured rather than propagated so the count still
        # gets published on a red shard - reconciliation needs it to tell "these
        # tests failed" from "these tests never ran". The shard is failed at the
        # end of the job instead.
        run: |
          started=$(date +%s)
          set +e
          dotnet test tests/AutoNate.Web.Tests --no-build \
            --filter "${{ matrix.shard.filter }}" \
            --logger "trx;LogFileName=shard.trx" \
            --results-directory "$PWD/trx"
          status=$?
          set -e
          {
            echo "elapsed=$(( $(date +%s) - started ))"
            echo "status=$status"
          } >> "$GITHUB_OUTPUT"

      - name: Report this shard
        # Runs whether the tests passed or not, for the reason above.
        if: always()
        run: |
          python3 .github/scripts/shard_report.py \
            --trx trx/shard.trx \
            --shard "${{ matrix.shard.index }}" \
            --elapsed "${{ steps.test.outputs.elapsed || 0 }}" \
            --count-file shard-count.txt \
            --summary-file shard-summary.md
          cat shard-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-count-${{ matrix.shard.index }}
          path: shard-count.txt
          retention-days: 1

      - name: Fail this shard if its tests failed
        # Deferred to here so the count is published first.
        if: always() && steps.test.outputs.status != '0'
        run: |
          echo "::error::Shard ${{ matrix.shard.index }} had test failures. See the job summary."
          exit 1

  backend-reconcile:
    name: Backend reconciliation
    runs-on: ubuntu-latest
    needs: [backend-discover, backend]
    # `always()` is load-bearing. By default a failing shard skips this job,
    # which would mask a lost test behind the very failure it caused - the one
    # case where the count matters most.
    if: always()
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-count-*
          path: counts

      - name: Every discovered test must have run somewhere
        run: |
          python3 .github/scripts/reconcile_shards.py \
            --counts-dir counts \
            --expected "${{ needs.backend-discover.outputs.total }}" \
            --shards-result "${{ needs.backend.result }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"


  image:
    name: App image (build + smoke test)
    runs-on: ubuntu-latest
    # The application image is otherwise built only when a release is cut, so a
    # Dockerfile can break and nothing says so until the worst possible moment.
    # That is not hypothetical: digest-pinning once put the image tag in a
    # trailing `#` comment on every FROM line, which Docker rejects outright,
    # and all three Dockerfiles were unbuildable for a while because `make
    # infra-up` reported healthy services from cached images and nothing
    # rebuilt. This job is the check that would have caught it the same day.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Start PostgreSQL
        # Same reason as the backend job: a service container cannot be given a
        # command, and the smoke test needs a database to initialise against.
        run: |
          docker run -d --name ci-smoke-postgres \
            -e POSTGRES_USER=autonate \
            -e POSTGRES_PASSWORD='Your_password123!' \
            -e POSTGRES_DB=flowable \
            -p 5432:5432 \
            postgres:16-alpine -c max_connections=300
          for i in $(seq 1 30); do
            if docker exec ci-smoke-postgres pg_isready -U autonate -d flowable >/dev/null 2>&1; then
              echo "PostgreSQL ready"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"; docker logs ci-smoke-postgres; exit 1

      - name: Create the application database
        run: |
          docker exec -e PGPASSWORD='Your_password123!' ci-smoke-postgres \
            psql -U autonate -d postgres -c 'CREATE DATABASE "AutoNate"'
          docker exec -e PGPASSWORD='Your_password123!' ci-smoke-postgres \
            psql -U autonate -d postgres -c 'CREATE DATABASE "autonate_datastores"'

      # Building IS the test. amd64 only: this gates PRs, and the arm64 build
      # runs under emulation and takes ~45 minutes for this image. Multi-arch is
      # the release workflow's job.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/AutoNate.Web/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: auton8:ci
          cache-from: type=gha,scope=autonate-web-ci
          cache-to: type=gha,mode=max,scope=autonate-web-ci

      - name: Smoke-test the container
        # Proves the image actually serves, not merely that it builds. Dapr is
        # deliberately bypassed: this job hosts no sidecar, and the app's
        # requirement for one is covered by the compose profile rather than
        # here.
        #
        # Flowable__BaseUrl points at a closed port on purpose. The app refuses
        # to start without the setting present — `Flowable:BaseUrl must be
        # configured.`, which is exactly what failed the first run of this job —
        # but it does not call Flowable during startup, so an unreachable
        # address is enough to get the image serving. Reaching a real engine is
        # the E2E job's business, not this one's.
        run: |
          docker run -d --name auton8-ci-smoke --network host \
            -e ConnectionStrings__Default='Host=127.0.0.1;Port=5432;Database=AutoNate;Username=autonate;Password=Your_password123!' \
            -e ConnectionStrings__Datastores='Host=127.0.0.1;Port=5432;Database=autonate_datastores;Username=autonate;Password=Your_password123!' \
            -e AUTONATE_ALLOW_RUNNING_WITHOUT_DAPR=true \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e Bootstrap__AdminUsername=ci-smoke \
            -e Bootstrap__AdminPassword='a password only this job uses' \
            -e Flowable__BaseUrl='http://127.0.0.1:9/flowable-rest' \
            auton8:ci

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health/live >/dev/null 2>&1; then
              echo "liveness answered"
              # And the SPA is really in the image, not just the backend.
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
              if [ "$code" != "200" ]; then
                echo "the app served no SPA at / (HTTP $code)"; docker logs auton8-ci-smoke; exit 1
              fi
              echo "SPA served"
              exit 0
            fi
            sleep 3
          done

          echo "the container never answered on /api/health/live"
          docker logs auton8-ci-smoke
          docker inspect --format='health={{.State.Health.Status}}' auton8-ci-smoke || true
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs auton8-ci-smoke || true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Not an artifact dependency any more — just don't spend 20 minutes on
    # browser tests when lint or typecheck already failed.
    needs: spa
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autonate
          POSTGRES_PASSWORD: Your_password123!
          POSTGRES_DB: flowable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autonate -d flowable"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The fixture launches the app under test with `-p:BuildSpa=true`, which
      # shells out to `npm run build` and mirrors dist/ into wwwroot — it also
      # deletes wwwroot first, so passing the spa job's bundle through as an
      # artifact would be thrown away. Node is needed here even though this job
      # runs no npm step of its own.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/AutoNate.Spa/package-lock.json

      - name: Install SPA dependencies
        working-directory: src/AutoNate.Spa
        run: npm ci

      - name: Start NATS with JetStream
        # Not a service container: those cannot pass a `command`, and NATS only
        # enables JetStream when started with --jetstream. The app's
        # NatsStreamProvisioner asserts the streams it needs on boot, so the
        # bootstrap script the compose stack runs is not needed here.
        run: |
          docker run -d --name autonate-ci-nats \
            -p 4222:4222 -p 8222:8222 \
            nats:2.12-alpine --jetstream --http_port 8222
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "NATS ready"; exit 0
            fi
            sleep 2
          done
          echo "NATS did not become healthy"; docker logs autonate-ci-nats; exit 1

      # The plugin-lifecycle spec uploads plugins/HelloPlugin/dist/HelloPlugin.zip,
      # which the plugin project's ZipPluginPackage target produces on build.
      # Nothing else in the solution depends on it, so it has to be asked for
      # explicitly or the upload fails with DirectoryNotFound.
      - name: Build the sample plugin package
        run: dotnet build plugins/HelloPlugin

      # The document and notes editors connect to the Hocuspocus sidecar on
      # :1234. Without it every editor spec fails — not on its own assertion
      # but on ConsoleErrorGuard, which turns the browser's repeated
      # "WebSocket connection to ws://localhost:1234/ failed" into a failure.
      # That dependency was only ever satisfied by the local compose stack, so
      # it never had to be written down until CI ran the suite on a clean
      # machine.
      #
      # AUTONATE_WEB_URL is required for the sidecar to boot but cannot be set
      # correctly: the fixture starts the app under test on a random port. It
      # points at the conventional dev port, which nothing is listening on, so
      # the webhook callbacks fail — exactly as they do locally, where that
      # port holds a dev app backed by a different database. What these specs
      # need is a listener on :1234, so the browser stops logging
      # ERR_CONNECTION_REFUSED and ConsoleErrorGuard stops failing them.
      - name: Start the Hocuspocus sidecar
        run: |
          docker build -t autonate-hocuspocus services/hocuspocus
          docker run -d --name autonate-ci-hocuspocus --network host \
            -e HOCUSPOCUS_PORT=1234 \
            -e AUTONATE_WEB_URL=http://127.0.0.1:5108 \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=AutoNate \
            -e POSTGRES_USER=autonate \
            -e POSTGRES_PASSWORD='Your_password123!' \
            -e YJS_INTERNAL_SHARED_SECRET=dev-only-yjs-internal-secret-change-me \
            autonate-hocuspocus
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 1234; then echo "Hocuspocus ready"; exit 0; fi
            sleep 2
          done
          echo "Hocuspocus did not open :1234"; docker logs autonate-ci-hocuspocus; exit 1

      - name: Build
        run: dotnet build tests/AutoNate.E2E.Tests

      # The Playwright .NET package ships this script next to the built test
      # assembly; it installs the browser binaries the fixture launches.
      - name: Install Playwright browsers
        run: pwsh tests/AutoNate.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # Excludes the specs that need services this job does not host: the
      # Flowable engine (workflow execution and studio) and the Dapr sidecar
      # (the bus-event log). They are traited rather than named, so a new
      # Flowable-dependent spec is excluded automatically instead of turning
      # the job red until someone updates a list here.
      #
      # This is a real coverage gap, not a cleanup: 155 of 163 specs run.
      # Standing up Flowable — a Spring Boot service built from source — and
      # Dapr in CI is its own piece of work, tracked on archived-79. Until then the
      # full suite remains the local and pre-release gate.
      - name: Test
        run: |
          dotnet test tests/AutoNate.E2E.Tests --no-build \
            --filter "RequiresService!=Flowable&RequiresService!=Dapr" \
            --logger "console;verbosity=minimal"

      # A failed selector is close to unreadable without the page. Playwright
      # writes traces/screenshots under the test output when a spec fails.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            tests/AutoNate.E2E.Tests/bin/Debug/net10.0/playwright-traces
            tests/AutoNate.E2E.Tests/bin/Debug/net10.0/test-results
          retention-days: 7
          if-no-files-found: ignore
