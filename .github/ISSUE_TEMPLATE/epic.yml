name: Epic
description: A large body of work with epic-level acceptance criteria. Stories attach as sub-issues.
title: "[Epic] "
labels: [epic]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One paragraph — what capability this epic delivers and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (epic level)
      description: One checkbox per criterion.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Context, constraints, out-of-scope.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Apply the matching `area:*` label after filing.
      options: [api, spa, plugins, services, flowable, infra, ci, docs, tests]
    validations:
      required: true
