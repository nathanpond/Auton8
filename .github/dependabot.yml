# Dependabot — version + security updates. Works on private repos (no Advanced Security needed).
# Minor/patch bumps are grouped per ecosystem to keep PR volume sane; majors arrive individually.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /                      # AutoNate.sln + Directory.Build.props at the root cover src/, tests/, plugins/
    schedule: { interval: weekly, day: monday }
    groups:
      nuget-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /src/AutoNate.Spa
    schedule: { interval: weekly, day: monday }
    groups:
      spa-minor-patch:
        update-types: [minor, patch]
        # Kept out of the group so the ~30 routine bumps can land while these
        # are decided on their own: BlockNote 0.54 removes the comments API
        # the SPA uses (needs a migration, with hocuspocus server-util in
        # lock-step); every @eigenpal/docx-editor-* version is deprecated on
        # npm (roadmap decision); @hocuspocus/provider must move with the
        # server in services/hocuspocus. Each still gets its own PR.
        exclude-patterns:
          - "@blocknote/*"
          - "@eigenpal/*"
          - "@hocuspocus/provider"
  - package-ecosystem: npm
    directory: /services/hocuspocus
    schedule: { interval: weekly, day: monday }
    groups:
      hocuspocus-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /services/executor
    schedule: { interval: weekly, day: monday }
    groups:
      executor-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /                      # root package.json: bpmn-js vendoring scripts
    schedule: { interval: monthly }
  - package-ecosystem: maven
    directory: /flowable-extension    # Spring Boot Flowable extension (JVM side of the workflow-behavior callbacks)
    schedule: { interval: weekly, day: monday }
    groups:
      maven-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /services/hocuspocus      # node:<major>-alpine base image (Node LTS policy: see .nvmrc)
    schedule: { interval: weekly, day: monday }
    ignore:
      # Node majors are taken deliberately when the next line enters LTS
      # (24 now; 26 in Oct 2026) — see .n8/decisions.md 2026-08-31.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /services/executor
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
