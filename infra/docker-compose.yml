services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685  # postgres:16-alpine
    container_name: autonate-postgres
    environment:
      POSTGRES_USER: ${AUTONATE_POSTGRES_USER:-autonate}
      POSTGRES_PASSWORD: ${AUTONATE_POSTGRES_PASSWORD:-Your_password123!}
      POSTGRES_DB: flowable
    ports:
      # Loopback-only, like NATS below. This is the local development stack:
      # it ships known credentials, so binding it on every interface puts a
      # writable database on the network of whatever cafe or office the laptop
      # is on. Containers reach it as `postgres:5432` over the compose network,
      # which is unaffected.
      - "127.0.0.1:${AUTONATE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./mounts/postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  flowable:
    build:
      context: ..
      dockerfile: infra/flowable/Dockerfile
    container_name: autonate-flowable
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTONATE_FLOWABLE_EVENTS_DAPR_PUBLISH_BASE_URL: http://127.0.0.1:3500
      AUTONATE_FLOWABLE_EVENTS_PUBSUB_NAME: pubsub
      AUTONATE_FLOWABLE_EVENTS_TOPIC_ROOT: workflow.execution.events
      AUTONATE_FLOWABLE_EVENTS_SOURCE_APP_ID: flowable
      # AutoNateBehaviorDelegate posts directly to AutoNate.Web for service
      # task → behavior dispatch. Must reach the host's app from inside the
      # Flowable container; the secret must match
      # WorkflowBehaviors:CallbackSharedSecret on the AutoNate.Web side.
      AUTONATE_FLOWABLE_EVENTS_CALLBACK_BASE_URL: ${AUTONATE_BEHAVIOR_CALLBACK_BASE_URL:-http://host.docker.internal:5108}
      AUTONATE_FLOWABLE_EVENTS_CALLBACK_SHARED_SECRET: ${AUTONATE_BEHAVIOR_CALLBACK_SECRET:-dev-only-workflow-behavior-secret-change-me}
      # Record per-update variable history (historic-detail rows). Default
      # `audit` only stores the latest value of each variable; `full` keeps
      # the change log we render in the Execution Log tab.
      FLOWABLE_PROCESS_HISTORY_LEVEL: full
      SERVER_PORT: 8080
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: ${AUTONATE_POSTGRES_USER:-autonate}
      SPRING_DATASOURCE_PASSWORD: ${AUTONATE_POSTGRES_PASSWORD:-Your_password123!}
      TZ: ${AUTONATE_FLOWABLE_TZ:-America/New_York}
    ports:
      - "127.0.0.1:${AUTONATE_FLOWABLE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  flowable-dapr:
    image: daprio/daprd@sha256:c758db3b1ea2ba04528c4636c199405d1abe76ffe2877134b3262183dcf4ee2c  # daprio/daprd:1.17.5
    container_name: autonate-flowable-dapr
    command:
      - ./daprd
      - --app-id
      - flowable
      - --app-port
      - "8080"
      - --app-channel-address
      - "127.0.0.1"
      - --dapr-http-port
      - "3500"
      - --resources-path
      - /components
      - --placement-host-address
      - dapr-placement:50006
      - --scheduler-host-address
      - dapr-scheduler:50007
    depends_on:
      # `network_mode: service:flowable` binds this sidecar to the flowable
      # container's network namespace at start time. When flowable restarts,
      # Docker recreates that namespace and we end up bound to the old,
      # defunct one — port 3500 is no longer reachable from the new flowable
      # JVM and every workflow-event publish fails with ConnectException.
      # `restart: true` makes Compose cascade a restart so the sidecar
      # re-attaches to the live namespace.
      flowable:
        condition: service_healthy
        restart: true
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      dapr-placement:
        condition: service_started
      dapr-scheduler:
        condition: service_started
    network_mode: "service:flowable"
    volumes:
      - ./mounts/flowable-dapr/components:/components:ro

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf  # redis:7.4-alpine
    container_name: autonate-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${AUTONATE_REDIS_PORT:-6379}:6379"
    volumes:
      - ./mounts/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6  # nats:2.12-alpine
    container_name: autonate-nats
    command:
      - --jetstream
      - --store_dir
      - /data
      - --http_port
      - "8222"
    ports:
      # Loopback-only, matching the Dapr endpoints in this file. NATS runs with
      # no authentication, so publishing these host-wide let anyone reaching
      # the Docker host queue work on `pipeline-code-run.>` (the executor runs
      # it), subscribe to the audit-event and workflow-signal streams, and read
      # JetStream state on 8222 — the HTTP callbacks have a shared-secret
      # boundary, NATS has none (archived-66). Containers still reach it as
      # `nats:4222` over the compose network, which is unaffected.
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ./mounts/nats/data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4222"]
      interval: 10s
      timeout: 5s
      retries: 12

  nats-init:
    image: natsio/nats-box@sha256:4b4fb1128c3ba46180d4510aaf2ca792c3fa997e4968a7bc9062f9554fbdb8b4  # natsio/nats-box:0.16.0
    container_name: autonate-nats-init
    depends_on:
      nats:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/bootstrap-jetstream.sh"]
    volumes:
      - ./scripts/bootstrap-jetstream.sh:/scripts/bootstrap-jetstream.sh:ro

  dapr-placement:
    image: daprio/placement@sha256:4c4b609cb0a0c0488361348eb1c4e869338c39390ee3010d727e59f6d561d544  # daprio/placement:1.17.5
    container_name: autonate-dapr-placement
    command: ["./placement", "--port", "50006"]
    ports:
      - "127.0.0.1:50006:50006"

  dapr-scheduler:
    image: daprio/scheduler@sha256:946f1912993355622042e174129192f199b9bf5d72a24c1e36b30e250e1a4603  # daprio/scheduler:1.17.5
    container_name: autonate-dapr-scheduler
    command: ["./scheduler", "--port", "50007", "--etcd-data-dir", "/data"]
    ports:
      - "127.0.0.1:50007:50007"
    user: root
    volumes:
      - ./mounts/dapr-scheduler/data:/data

  hocuspocus:
    build:
      context: ../services/hocuspocus
      dockerfile: Dockerfile
    container_name: autonate-hocuspocus
    # Survive transient crashes (e.g. webhook fetch failures during .NET
    # restarts) so `ensure-up` doesn't need a full `compose down` to
    # recover. Hooks own their own retry semantics; this is just process
    # supervision.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOCUSPOCUS_PORT: "1234"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: AutoNate
      POSTGRES_USER: ${AUTONATE_POSTGRES_USER:-autonate}
      POSTGRES_PASSWORD: ${AUTONATE_POSTGRES_PASSWORD:-Your_password123!}
      # .NET reachable from inside the container at host.docker.internal.
      # Override AUTONATE_WEB_URL in deployments where the .NET app is a
      # peer container instead of the dev-host process.
      AUTONATE_WEB_URL: ${AUTONATE_WEB_URL:-http://host.docker.internal:5108}
      YJS_INTERNAL_SHARED_SECRET: ${YJS_INTERNAL_SHARED_SECRET:-dev-only-yjs-internal-secret-change-me}
    ports:
      - "127.0.0.1:${AUTONATE_HOCUSPOCUS_PORT:-1234}:1234"
    extra_hosts:
      # Needed on Linux hosts so host.docker.internal resolves; harmless
      # on macOS / Docker Desktop where the entry is provided by default.
      - "host.docker.internal:host-gateway"

  executor:
    # Code-transformer / analyzer sandbox (isolated-vm for JS, Pyodide for
    # Python). Pure NATS worker: no ports. The .NET host publishes
    # CodeNodeRequests on `pipeline-code-run.<runId>.<nodeId>`
    # (Services/Pipelines/Execution/JetStreamCodeNodeRunner.cs) and this
    # container answers on the reply subject. Without it every code node in a
    # pipeline times out after 30 s (archived-114).
    build:
      context: ../services/executor
      dockerfile: Dockerfile
    container_name: autonate-executor
    # Same rationale as hocuspocus: process supervision only. The sidecar
    # exits on NATS reconnect exhaustion (archived-69) and should simply come back.
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      NATS_URL: nats://nats:4222
      NODE_ENV: production
    healthcheck:
      # Asks the running process over NATS (its only interface) whether it is
      # connected and serving — see services/executor/src/healthcheck.ts.
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  dapr-dashboard:
    image: daprio/dashboard@sha256:4be696707bd1349b49875f8e6da0d27dad742834483740d5a7897a73abeaf83d  # daprio/dashboard:0.15.0
    container_name: autonate-dapr-dashboard
    command:
      - --docker-compose=true
      - --components-path=/components
    profiles:
      - dashboard
    ports:
      - "127.0.0.1:${AUTONATE_DAPR_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - ./mounts/dapr-dashboard/components:/components:ro
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      dapr-placement:
        condition: service_started
      dapr-scheduler:
        condition: service_started
