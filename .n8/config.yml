version: 1
stack: dotnet            # ASP.NET Core (net10.0) host + React 19/Vite/TypeScript SPA + Node sidecars
initialized: 2026-08-30
wiki: enabled            # seeded 2026-09-02 with the codebase map; docs/codebase/ removed so there is one copy
repo: nathanpond/Auton8
visibility: public       # public since 2026-09-02, in a fresh repository — see decisions.md
default_branch: master   # n8SDLC docs say `main`; this repo uses `master` — skills should target the default branch, not the literal name
context7: installed
security_findings: advisories  # public repo: an open sev:high issue advertises an exploit against
                              # running deployments. Draft advisories stay maintainer-only until
                              # published. The 26 closed security issues predate the flip and were
                              # all closed as fixed, so they stay as a public register.
deployment:
  dev: local Docker Compose stack (infra/docker-compose.yml) + `make app`; the app runs on the host with a Dapr sidecar
  stage: none — dev only for v1.0 (owner's call, 2026-09-02)
  production: none yet. v1.0 ships a release artifact others run; hosting is a post-1.0 decision
  notes: >-
    "Eventually anywhere." Docker Compose is the supported target for v1.0.
    Kubernetes and cloud PaaS are deliberately post-1.0 epics, not v1.0 scope.
ci:
  provider: github-actions
  on_pr: [spa-lint, spa-typecheck, spa-build, backend-tests, e2e]
  release: >-
    A `v*` tag publishes four multi-arch images (autonate-web, hocuspocus,
    executor, flowable) to GHCR with SLSA build provenance, and attaches a
    digest-pinned compose file plus quickstart to the GitHub release
    (planned in M0, #56/#58). Still no *deployment* pipeline in v1.0 scope —
    nothing is deployed anywhere; a release is an artifact others run.
  notes: >-
    E2E runs 155 of 163 specs; the 8 excluded need Flowable and Dapr, which the
    runner does not host. The owner did NOT select closing that gap as part of
    "CI up to snuff" — the chosen bar is quality gates, faster feedback, and
    making use of what a public repo unlocks (CodeQL, Semgrep, FsCheck).

areas: [api, spa, plugins, services, flowable, infra, ci, docs, tests]
# area:api      → src/AutoNate.Web (ASP.NET Core host: endpoints, persistence, authorization, hooks)
# area:spa      → src/AutoNate.Spa (React 19 + Mantine v9 SPA)
# area:plugins  → src/AutoNate.Plugin.Abstractions + plugins/
# area:services → services/ (hocuspocus, executor Node sidecars)
# area:flowable → flowable-extension/
# area:infra    → infra/, Makefile, .run/ (compose stack, Dapr, local dev plumbing)
# area:ci       → .github/workflows
# area:docs     → docs/, README.md, CLAUDE.md
# area:tests    → tests/ (AutoNate.Web.Tests, E2E)
